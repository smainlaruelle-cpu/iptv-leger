name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Compile
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk iptv-leger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iptv-leger-apk
          path: iptv-leger.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest iptv-leger.apk --title "IPTV Leger" --notes "Build ${GITHUB_SHA}" --target "${GITHUB_SHA}"
